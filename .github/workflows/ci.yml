name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zahnarzt_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zahnarzt_ci
      NEXTAUTH_SECRET: ci-only-secret-not-used-in-production
      NEXTAUTH_URL: http://localhost:3000
      ANTHROPIC_API_KEY: dummy-key-for-build
      ANTHROPIC_MODEL: claude-sonnet-5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Prisma Client generieren
        run: npx prisma generate

      - name: Migrationen gegen Test-DB anwenden (prüft, dass sie fehlerfrei laufen)
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Vitest (Geschäftslogik)
        run: npm test

      - name: Next.js Build
        run: npm run build
