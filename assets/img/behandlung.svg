<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Physiotherapeut mit kurzen blonden Locken behandelt eine Patientin an der Behandlungsliege">
  <title>Behandlung an der Liege</title>

  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%"   stop-color="#3B4630"/>
      <stop offset="45%"  stop-color="#262E1F"/>
      <stop offset="100%" stop-color="#11150D"/>
    </linearGradient>

    <radialGradient id="bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#F2F5EE" stop-opacity="0.58"/>
      <stop offset="40%"  stop-color="#CBD3C2" stop-opacity="0.27"/>
      <stop offset="74%"  stop-color="#8D9A80" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#8D9A80" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="paneGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#F6F9F2" stop-opacity="0.46"/>
      <stop offset="68%"  stop-color="#DCE3D4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#AEB9A2" stop-opacity="0.04"/>
    </linearGradient>

    <linearGradient id="hazeUp" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#C8D2BE" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#C8D2BE" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1C2216"/>
      <stop offset="100%" stop-color="#0B0E07"/>
    </linearGradient>

    <linearGradient id="sheetGrad" x1="0.1" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#EDF1E8" stop-opacity="0.95"/>
      <stop offset="55%"  stop-color="#B7C1AB" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#6C7860" stop-opacity="0.5"/>
    </linearGradient>

    <radialGradient id="vignette" cx="44%" cy="42%" r="76%">
      <stop offset="46%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.64"/>
    </radialGradient>

    <filter id="soft"   x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="softer" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="hairGlow" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="micro"  x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <!-- ROOM -->
  <rect width="1600" height="1000" fill="url(#room)"/>

  <!-- WINDOW behind the scene -->
  <g filter="url(#soft)">
    <rect x="236" y="34" width="716" height="600" rx="58" fill="url(#paneGlow)"/>
  </g>
  <ellipse cx="592" cy="316" rx="530" ry="430" fill="url(#bloom)"/>
  <g fill="#0D1108" opacity="0.22" filter="url(#micro)">
    <rect x="318" y="34" width="10" height="580"/>
    <rect x="862" y="34" width="10" height="580"/>
  </g>

  <!-- FLOOR -->
  <rect x="0" y="790" width="1600" height="210" fill="url(#floor)"/>
  <rect x="0" y="787" width="1600" height="2.5" fill="#DADED8" opacity="0.10"/>
  <ellipse cx="740" cy="826" rx="560" ry="44" fill="#040602" opacity="0.7" filter="url(#soft)"/>

  <!-- THERAPIST — dark silhouette -->
  <g fill="#141911">
    <path d="M508,590 C505,656 503,722 505,784 L562,784 C562,720 564,654 566,590 Z"/>
    <path d="M584,590 C586,656 590,722 594,784 L648,784 C644,720 640,654 638,590 Z"/>

    <!-- torso, leaning forward over the table -->
    <path d="
      M598,250
      C634,254 656,280 664,318
      C672,368 668,426 662,480
      C658,522 654,562 652,600
      L552,600
      C550,564 549,524 552,482
      C556,424 564,360 578,312
      C585,280 590,250 598,250 Z"/>

    <!-- neck -->
    <path d="M578,238 L620,238 L624,278 L574,278 Z"/>

    <!-- head + short curly hair as ONE mass, scalloped top -->
    <path d="
      M552,222
      C546,204 550,187 561,177
      A 16,16 0 0 1 586,165
      A 17,17 0 0 1 612,163
      A 16,16 0 0 1 637,176
      C649,186 655,204 651,224
      C649,242 642,254 630,260
      C614,268 588,268 573,260
      C560,253 553,240 552,222 Z"/>

    <!-- far arm -->
    <path fill="none" stroke="#141911" stroke-width="30" stroke-linecap="round"
          d="M648,330 C628,392 598,444 556,492 C538,512 526,524 518,530"/>
    <!-- near arm, swung clear of the torso -->
    <path fill="none" stroke="#141911" stroke-width="31" stroke-linecap="round"
          d="M562,324 C526,382 500,430 478,476 C468,500 462,516 459,527"/>
    <ellipse cx="452" cy="532" rx="26" ry="16"/>
    <ellipse cx="512" cy="534" rx="26" ry="16"/>
  </g>

  <!-- TABLE -->
  <g>
    <rect x="752" y="644" width="326" height="144" rx="6" fill="#0D1108"/>
    <rect x="732" y="782" width="366" height="10" rx="5" fill="#090C05"/>
    <rect x="250" y="600" width="1092" height="46" rx="23" fill="#12170F"/>
    <rect x="266" y="574" width="1060" height="30" rx="15" fill="#1B2116"/>
  </g>

  <!-- PATIENT -->
  <g>
    <path fill="#232B1C" d="
      M306,580
      C300,548 318,522 346,522
      C372,522 386,545 383,567
      C404,558 430,546 460,540
      C500,533 540,535 568,542
      C642,558 708,566 782,570
      C858,574 920,570 970,562
      C1026,553 1070,557 1102,566
      C1150,578 1190,582 1220,582
      Z"/>
    <path fill="url(#sheetGrad)" d="
      M838,566 C904,560 960,558 1016,562
      C1078,566 1142,574 1202,582
      L1202,606 L838,606 Z"/>
    <path fill="none" stroke="#F2F5EE" stroke-opacity="0.42" stroke-width="2.4" d="M846,572 C912,564 984,564 1052,572"/>
  </g>

  <!-- RIM LIGHT — follows the real silhouette edges -->
  <g fill="none" stroke-linecap="round">
    <!-- table edges -->
    <path stroke="#DADED8" stroke-opacity="0.30" stroke-width="2.6" d="M270,577 C520,573 1060,573 1322,577"/>
    <path stroke="#DADED8" stroke-opacity="0.18" stroke-width="2.2" d="M256,603 C520,599 1080,599 1336,603"/>

    <!-- patient head + back contour -->
    <path stroke="#DADED8" stroke-opacity="0.5" stroke-width="2.8"
          d="M306,574 C302,542 320,522 347,522 C371,522 386,542 384,564"/>
    <path stroke="#DADED8" stroke-opacity="0.38" stroke-width="2.6"
          d="M398,558 C458,538 534,535 592,547 C664,560 730,568 790,571"/>

    <!-- therapist: lit contour down the window side of the torso, stopping at the table -->
    <path stroke="#E8EDE2" stroke-opacity="0.58" stroke-width="3"
          d="M580,306 C566,352 557,414 553,478 C551,514 550,544 551,566"/>
    <!-- shoulder -->
    <path stroke="#E8EDE2" stroke-opacity="0.5" stroke-width="2.8"
          d="M586,268 C614,262 648,286 662,320"/>
    <!-- near arm: light along its outer edge -->
    <path stroke="#E8EDE2" stroke-opacity="0.44" stroke-width="2.4"
          d="M548,332 C514,388 490,434 470,478"/>
    <!-- hands -->
    <path stroke="#E8EDE2" stroke-opacity="0.5" stroke-width="2.2" d="M430,528 C444,520 462,520 474,527"/>
    <path stroke="#E8EDE2" stroke-opacity="0.5" stroke-width="2.2" d="M490,530 C504,522 522,522 534,529"/>
  </g>

  <!-- BLONDE CURLS — warm backlight on the hair contour only -->
  <g filter="url(#hairGlow)" opacity="0.7">
    <path fill="none" stroke="#F6E9C4" stroke-width="7" stroke-linecap="round"
          d="M552,222 C546,204 550,187 561,177
             A 16,16 0 0 1 586,165
             A 17,17 0 0 1 612,163
             A 16,16 0 0 1 637,176
             C647,185 653,199 652,214"/>
  </g>
  <g fill="none" stroke-linecap="round">
    <path stroke="#F7EDD2" stroke-opacity="0.9" stroke-width="3.4"
          d="M552,222 C546,204 550,187 561,177
             A 16,16 0 0 1 586,165
             A 17,17 0 0 1 612,163
             A 16,16 0 0 1 637,176
             C647,185 653,199 652,214"/>
    <!-- individual curl highlights along the lit side -->
    <path stroke="#FDF6E2" stroke-opacity="0.75" stroke-width="2.4" d="M556,206 C552,192 558,180 570,175"/>
    <path stroke="#FDF6E2" stroke-opacity="0.6"  stroke-width="2.2" d="M574,172 C582,164 594,162 602,166"/>
    <path stroke="#EBD9A8" stroke-opacity="0.5"  stroke-width="2.2" d="M608,164 C618,162 630,168 635,178"/>
    <path stroke="#EBD9A8" stroke-opacity="0.35" stroke-width="2"   d="M643,190 C650,200 652,212 650,222"/>
    <!-- nape -->
    <path stroke="#D9C79A" stroke-opacity="0.4"  stroke-width="2.2" d="M566,250 C578,260 600,263 618,258"/>
  </g>

  <!-- ATMOSPHERE -->
  <rect x="0" y="430" width="1600" height="420" fill="url(#hazeUp)" filter="url(#softer)" opacity="0.7"/>
  <rect width="1600" height="1000" fill="url(#vignette)"/>
</svg>
